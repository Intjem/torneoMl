<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100d12" />
  <meta name="description" content="Plataforma Sky Kings de torneos Mobile Legends: Bang Bang — registro, inscripciones y brackets en vivo." />
  <title>Sky Kings — Torneos MLBB</title>
  <link rel="stylesheet" href="styles-simple.css" />
</head>
<body data-require-auth="true">
  <header class="topbar">
    <a class="topbar__brand" href="index.html" aria-label="Sky Kings - Inicio">
      <img class="brand-logo" src="assets/sky-kings-logo.png" alt="" />
      <span class="brand-word">Sky <span>Kings</span></span>
    </a>
    <nav class="topbar__nav">
      <span class="topbar__link user-info">Usuario</span>
      <button class="topbar__link" id="logoutBtn" style="background:none;border:none;cursor:pointer;padding:0;font-size:inherit;">Cerrar sesión</button>
    </nav>
  </header>

  <main class="landing">
    <img class="landing__logo" src="assets/sky-kings-logo.png" alt="Sky Kings" />
    <h1>Torneos Sky Kings MCGG</h1>
    <p class="muted" style="margin-bottom: 1.5rem">Bienvenido, <span class="user-info">Usuario</span> (<span class="user-role">Jugador</span>)</p>
    <div class="landing__btns">
      <a class="btn btn--primary" href="torneo.html">Ver torneos</a>
      <a class="btn btn--ghost" href="equipos.html">Equipos (Unirse/Inscribir)</a>
      <a class="btn btn--ghost" href="registro-equipos.html">Crear equipo</a>
      <a class="btn btn--ghost" href="admin.html" id="adminLink" hidden>Panel Admin</a>
    </div>
    <p class="muted" style="margin-top: 2rem; max-width: 32ch">
      Sistema en línea — los datos se guardan en la nube con actualizaciones en tiempo real.
    </p>
  </main>

  <script src="auth.js"></script>
  <script>
    // Mostrar enlace de admin si es administrador
    if (window.Auth && window.Auth.isAdmin()) {
      const adminLink = document.getElementById('adminLink');
      if (adminLink) adminLink.hidden = false;
    }
  </script>
</body>
</html>
